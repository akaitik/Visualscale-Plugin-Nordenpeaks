# ─────────────────────────────────────────────────────────────────────────────
# config.yml — VisualScalePlugin 2.0.0
# ─────────────────────────────────────────────────────────────────────────────

# Distancia en bloques dentro de la cual se envían actualizaciones de escala.
viewer-range: 64.0

# Intervalo de autoguardado en minutos. 0 = desactivado.
auto-save-interval: 5

# Rango de escala válido.
min-scale: 0.0625
max-scale: 16.0

# Escalas disponibles en un evento /race.
race-scales:
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  - 2.0
